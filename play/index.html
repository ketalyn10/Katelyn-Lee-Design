<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5B7TTVXPLB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      window.dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "G-5B7TTVXPLB");
  </script>

  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Play — Katelyn Lee Design</title>

  <link rel="stylesheet" href="../project.css" />
</head>

<body class="play-page">
  <div class="play-wrapper">

    <!-- LEFT SIDEBAR -->
    <aside class="play-sidebar">
      <div class="play-sidebar-top">
        <a href="../" class="site-title">
          KATELYN LEE
        </a>

        <!-- CURRENT PROJECT INFORMATION -->
        <div class="play-project-info">
          <div class="play-project-heading">
            <h1 class="play-project-title" id="play-project-title">
              Activity Log
            </h1>

            <span class="play-project-year" id="play-project-year">
              2026
            </span>
          </div>

          <div
            class="play-project-description"
            id="play-project-description"
          >
            Various data visualization posters rendered via p5.js for Katelyn Lee is Online.
          </div>
        </div>
      </div>

      <!-- PROJECT SELECTOR -->
      <div
        class="play-project-list"
        aria-label="Play projects"
      >
        <button
          class="play-project-button active"
          type="button"
          data-project="KLIO"
        >
          <span>Activity Log</span>
          <span>2026</span>
        </button>

        <button
          class="play-project-button"
          type="button"
          data-project="riso"
        >
          <span>Riso Animation + Flipbooks</span>
          <span>2025</span>
        </button>

        <button
          class="play-project-button"
          type="button"
          data-project="wienerschnitzel"
        >
          <span>Wiener Dog Hall of Fame</span>
          <span>2023</span>
        </button>

        <button
          class="play-project-button"
          type="button"
          data-project="hyundai"
        >
          <span>Hyundai E-bike</span>
          <span>2023</span>
        </button>

        <button
          class="play-project-button"
          type="button"
          data-project="blender"
        >
          <span>Blender Animations</span>
          <span>2024</span>
        </button>

        <button
          class="play-project-button"
          type="button"
          data-project="touchdesigner"
        >
          <span>TouchDesigner Experiment</span>
          <span>2025</span>
        </button>
      </div>
    </aside>

    <!-- RIGHT CONTENT -->
    <main class="play-content">
      <nav class="top-nav">
        <a href="../">Work</a>
        <a href="../play" class="active">Play</a>
        <a href="../about">About</a>
       <a href="https://drive.google.com/file/d/1V6LuvaHBBj7gBq3loCqaI6xz7B3jAZRT/view?usp=sharing" target="_blank">Resume</a>
      </nav>

      <section
        class="play-carousel"
        id="play-carousel"
        aria-label="Project carousel"
      >
        <div class="play-carousel-media" id="play-carousel-media">
          <!-- Media is inserted by play.js -->
        </div>

        <button
          class="play-carousel-zone play-carousel-zone-left"
          id="play-carousel-previous"
          type="button"
          aria-label="Previous image"
        ></button>

        <button
          class="play-carousel-zone play-carousel-zone-right"
          id="play-carousel-next"
          type="button"
          aria-label="Next image"
        ></button>
      </section>

      <div class="play-carousel-footer">
        <span id="play-carousel-count">1 / 2</span>

        <div class="play-carousel-controls">
          <button
            id="play-previous-button"
            type="button"
            aria-label="Previous image"
          >
            ←
          </button>

          <button
            id="play-next-button"
            type="button"
            aria-label="Next image"
          >
            →
          </button>
        </div>
      </div>
    </main>
  </div>


   <div class="carousel-cursor" aria-hidden="true">☞</div>
  <script src="../play.js"></script>
</body>
</html>
